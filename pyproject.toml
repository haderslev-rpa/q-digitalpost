[project]
name = "q-digitalpost"
version = "0.1.0"
description = "Fælles bestilling af Digital Post i Haderslev Kommune"
requires-python = ">=3.13"
dependencies = [
    "automation-server-client",
    "q-sharepoint-api",
]

[tool.uv.sources]
automation-server-client = { git = "https://github.com/odense-rpa/automation-server-client.git", tag = "v0.3.0" }
q-sharepoint-api = { git = "https://github.com/haderslev-rpa/q-sharepoint-api.git", branch = "main" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["q_digitalpost"]
